<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamSathi AI Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: #123a8c;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #123a8c;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #123a8c;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout-btn {
      background: #991b1b;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .admin-info {
      background: #e8efff;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    #loginSection,
    #adminSection {
      display: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>🤖 ExamSathi AI Admin Panel</h1>
    <p>Government Exam Updates Manage Karein</p>
  </header>

  <div class="container">

    <!-- LOGIN -->

    <div class="card" id="loginSection">
      <h2>🔐 Admin Login</h2>

      <form id="loginForm">

        <label>Email</label>
        <input
          type="email"
          id="loginEmail"
          required
          placeholder="Admin email"
        >

        <label>Password</label>
        <input
          type="password"
          id="loginPassword"
          required
          placeholder="Password"
        >

        <button type="submit">🔐 Login Karein</button>

      </form>

      <div id="loginMessage"></div>
    </div>


    <!-- ADMIN PANEL -->

    <div class="card" id="adminSection">

      <div class="admin-info">
        👤 Logged in as: <strong id="adminEmail"></strong>
      </div>

      <h2>➕ Add New Update</h2>

      <form id="updateForm">

        <label>Category</label>
        <select id="category" required>
          <option value="job">💼 Job</option>
          <option value="admit">🎫 Admit Card</option>
          <option value="result">🏆 Result</option>
          <option value="answer">📝 Answer Key</option>
        </select>

        <label>Title</label>
        <input id="title" required placeholder="Jaise: SSC GD Constable Recruitment 2026">

        <label>Department / Organization</label>
        <input id="department" placeholder="Jaise: Staff Selection Commission">

        <label>Short Description</label>
        <textarea id="short_description" placeholder="Short information likhein..."></textarea>

        <label>Total Vacancies</label>
        <input id="total_vacancies" placeholder="Jaise: 25000">

        <label>Qualification</label>
        <input id="qualification" placeholder="Jaise: 10th Pass">

        <label>Age Limit</label>
        <input id="age_info" placeholder="Jaise: 18-23 Years">

        <label>Salary</label>
        <input id="salary" placeholder="Jaise: ₹21,700 - ₹69,100">

        <label>Application Start Date</label>
        <input id="application_start_date" placeholder="DD/MM/YYYY">

        <label>Application Last Date</label>
        <input id="application_last_date" placeholder="DD/MM/YYYY">

        <label>Exam Date</label>
        <input id="exam_date" placeholder="To be announced">

        <label>Application Fee</label>
        <input id="application_fee" placeholder="Jaise: General ₹100">

        <label>Selection Process</label>
        <textarea id="selection_process" placeholder="Jaise: CBT → PET/PST → Medical"></textarea>

        <label>Exam Pattern</label>
        <textarea id="exam_pattern" placeholder="Exam pattern ki details..."></textarea>

        <label>Complete Details</label>
        <textarea id="full_details" placeholder="Complete information..."></textarea>

        <label>Official Notification Link</label>
        <input id="official_notification_url" placeholder="Official notification link">

        <label>Apply Online Link</label>
        <input id="apply_online_url" placeholder="Official apply link">

        <button type="submit">🚀 Update Publish Karein</button>

      </form>

      <button class="logout-btn" id="logoutBtn">
        🚪 Logout
      </button>

      <div id="message"></div>
      <hr style="margin: 35px 0; border: 1px solid #e5e7eb;">

<h2>📋 Manage Updates</h2>

<div id="updatesList">
  ⏳ Updates load ho rahe hain...
</div>
    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://hzskmosmpqwqurtrqbza.supabase.co";
    const SUPABASE_KEY = "sb_publishable_zOLpGIbaEVV2nJdi2dnnNA_mai6SsTJ";

    const ADMIN_EMAIL = "vikramrathour274@gmail.com";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginSection = document.getElementById("loginSection");
    const adminSection = document.getElementById("adminSection");
    const loginForm = document.getElementById("loginForm");
    const updateForm = document.getElementById("updateForm");
    const logoutBtn = document.getElementById("logoutBtn");

    const loginMessage = document.getElementById("loginMessage");
    const message = document.getElementById("message");


    function showLogin() {
      loginSection.style.display = "block";
      adminSection.style.display = "none";
    }


    function showAdmin(user) {
      loginSection.style.display = "none";
      adminSection.style.display = "block";

      document.getElementById("adminEmail").textContent =
        user.email;
    }


    async function checkUser() {
      const {
        data: { user }
      } = await supabaseClient.auth.getUser();
      
      console.log("Logged in user:", user);
      
      if (user && user.email === ADMIN_EMAIL) {
        showAdmin(user);
      } else {
        await supabaseClient.auth.signOut();
        showLogin();
      }
    }


    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      loginMessage.style.display = "block";
      loginMessage.textContent = "⏳ Login ho raha hai...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        loginMessage.className = "error";
        loginMessage.textContent =
          "❌ Login failed: " + error.message;
        return;
      }

      if (
        data.user &&
        data.user.email === ADMIN_EMAIL
      ) {
        loginMessage.style.display = "none";
        showAdmin(data.user);
      } else {
        await supabaseClient.auth.signOut();

        loginMessage.className = "error";
        loginMessage.textContent =
          "❌ Aapko admin access nahi hai.";
      }
    });


    logoutBtn.addEventListener("click", async function() {
      await supabaseClient.auth.signOut();
      showLogin();
    });


    updateForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (!user || user.email !== ADMIN_EMAIL) {
        alert("Admin login required.");
        showLogin();
        return;
      }

      const updateData = {
        category: document.getElementById("category").value,
        title: document.getElementById("title").value,
        department: document.getElementById("department").value,
        short_description: document.getElementById("short_description").value,
        total_vacancies: document.getElementById("total_vacancies").value,
        qualification: document.getElementById("qualification").value,
        age_info: document.getElementById("age_info").value,
        salary: document.getElementById("salary").value,
        application_start_date: document.getElementById("application_start_date").value,
        application_last_date: document.getElementById("application_last_date").value,
        exam_date: document.getElementById("exam_date").value,
        application_fee: document.getElementById("application_fee").value,
        selection_process: document.getElementById("selection_process").value,
        exam_pattern: document.getElementById("exam_pattern").value,
        full_details: document.getElementById("full_details").value,
        official_notification_url:
          document.getElementById("official_notification_url").value,
        apply_online_url:
          document.getElementById("apply_online_url").value,
        is_published: true
      };

      message.style.display = "block";
      message.className = "";
      message.textContent = "⏳ Update publish ho raha hai...";

      let error;
const {
  data: { session }
} = await supabaseClient.auth.getSession();

if (!session) {
  message.className = "error";
  message.textContent = "❌ Login session nahi mila. Logout karke dobara login karein.";
  return;
    }
if (window.editingUpdateId) {
  const result = await supabaseClient
    .from("updates")
    .update(updateData)
    .eq("id", window.editingUpdateId);

  error = result.error;

} else {
  const result = await supabaseClient
    .from("updates")
    .insert([updateData]);

  error = result.error;
}

      if (error) {
        console.error(error);
        message.className = "error";
        message.textContent = "❌ Error: " + error.message;
        return;
      }

      message.className = "success";

if (window.editingUpdateId) {
  message.textContent = "✅ Update successfully save ho gaya!";
  window.editingUpdateId = null;
} else {
  message.textContent = "✅ Update successfully publish ho gaya!";
}

updateForm.reset();
loadAdminUpdates();
    });
async function loadAdminUpdates() {
  const updatesList = document.getElementById("updatesList");

  updatesList.innerHTML = "⏳ Updates load ho rahe hain...";

  const { data, error } = await supabaseClient
    .from("updates")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    console.error(error);
    updatesList.innerHTML =
      "❌ Updates load nahi ho paaye: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    updatesList.innerHTML = "Abhi koi update available nahi hai.";
    return;
  }

  updatesList.innerHTML = data.map((update) => `
  <div style="
    border: 1px solid #e5e7eb;
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 10px;
  ">
    <strong>${update.title}</strong><br>

    <small>
      Category: ${update.category || "Update"} |
      ${update.department || "No department"}
    </small>

    <br><br>
<button
  onclick="togglePublish(${update.id}, ${update.is_published})"
  style="
    width: auto;
    margin: 0 8px 0 0;
    padding: 8px 14px;
  "
>
  ${update.is_published ? "🙈 Hide" : "👁️ Publish"}
</button>

  <button
      onclick="deleteUpdate(${update.id})"
      style="
        width: auto;
        margin: 0;
        padding: 8px 14px;
        background: #dc2626;
      "
    >
      🗑️ Delete
    </button>
  </div>
`).join("");
    }
    async function editUpdate(id) {
  const { data, error } = await supabaseClient
    .from("updates")
    .select("*")
    .eq("id", id)
    .single();

  if (error || !data) {
    alert("Update details load nahi ho paayi.");
    return;
  }

  document.getElementById("category").value = data.category || "job";
  document.getElementById("title").value = data.title || "";
  document.getElementById("department").value = data.department || "";
  document.getElementById("short_description").value = data.short_description || "";
  document.getElementById("total_vacancies").value = data.total_vacancies || "";
  document.getElementById("qualification").value = data.qualification || "";
  document.getElementById("age_info").value = data.age_info || "";
  document.getElementById("salary").value = data.salary || "";
  document.getElementById("application_start_date").value = data.application_start_date || "";
  document.getElementById("application_last_date").value = data.application_last_date || "";
  document.getElementById("exam_date").value = data.exam_date || "";
  document.getElementById("application_fee").value = data.application_fee || "";
  document.getElementById("selection_process").value = data.selection_process || "";
  document.getElementById("exam_pattern").value = data.exam_pattern || "";
  document.getElementById("full_details").value = data.full_details || "";
  document.getElementById("official_notification_url").value = data.official_notification_url || "";
  document.getElementById("apply_online_url").value = data.apply_online_url || "";

  window.editingUpdateId = id;

  updateForm.scrollIntoView({
  behavior: "smooth"
});

  alert("✏️ Update edit mode mein load ho gaya hai.");
    }
async function deleteUpdate(id) {
  const confirmDelete = confirm(
    "Kya aap is update ko delete karna chahte hain?"
  );

  if (!confirmDelete) return;

  const { error } = await supabaseClient
    .from("updates")
    .delete()
    .eq("id", id);

  if (error) {
    console.error(error);
    alert("Delete nahi ho paaya: " + error.message);
    return;
  }

  alert("Update successfully delete ho gaya!");
  loadAdminUpdates();
    }
    
    checkUser();
    loadAdminUpdates();
  </script>

</body>
  </html>
